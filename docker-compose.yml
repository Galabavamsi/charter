services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: charter
      POSTGRES_PASSWORD: charter
      POSTGRES_DB: charter
    ports:
      - '5432:5432'
    volumes:
      - charter_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U charter']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  charter_pg:
